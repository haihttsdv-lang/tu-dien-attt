name: Kiểm thử & Triển khai GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Kiểm tra kiểu dữ liệu TypeScript
        run: npx tsc -b --noEmit
      # FR-T02: cuong che nguon o tang CI, doc lap voi UI — build phai
      # THAT BAI neu ton tai noi dung quy pham thieu nguon (URD Muc 10).
      - name: Kiểm tra toàn vẹn nguồn nội dung (FR-T01/T02)
        run: npm run validate:content
      - name: Chạy unit + integration test
        run: npm test

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (base path = /${{ github.event.repository.name }}/)
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
